function renderTable(kind,title,cols,rowsKey){
  seedLinked(data());
  const rows=data()[rowsKey];
  const secId=kind==="SCHEDULE"?"TABLE:SCHEDULE":("TABLE:"+kind);
  const cc=contestCodeOf();
  const head=cols.map(c=>{
    const f=meta(secId,c);
    const allow=!!f.allow_empty;
    return `<th data-tip="${esc(tipFor(f))}">${esc(c)} <span class="empty-pill ${allow?"is-opt":"is-req"}">${allow?"можно пусто":"обязательно"}</span></th>`;
  }).join("")+"<th></th>";
  const body=rows.map((row,ri)=>{
    row.CONTEST_CODE=cc;
    const cells=cols.map(c=>{
      const f=meta(secId,c);
      if(c==="CONTEST_CODE"){
        return `<td><div class="locked-value" data-tip="Код конкурса из шага Конкурс — не меняется"><span>${esc(cc||"—")}</span><span class="locked-value__hint">из Конкурс</span></div></td>`;
      }
      if(f.kind==="dropdown"&&(f.variants||[]).length){
        return `<td><div class="chips" data-r="${ri}" data-c="${esc(c)}">${(f.variants||[]).map(v=>{
          const lab=labelForVariant(f,v);
          return `<button type="button" class="default-chip${String(row[c]||"")===String(v)?" is-on":""}" data-v="${esc(v)}" data-tip="${esc(lab?lab+" → "+v:v)}"><span class="default-chip__mark">${markSvg()}</span>${chipFaceHtml(v,lab)}</button>`;
        }).join("")}</div></td>`;
      }
      if(f.kind==="date") return `<td><input class="cell-input" data-r="${ri}" data-c="${esc(c)}" value="${esc(row[c]||"")}" placeholder="YYYY-MM-DD" data-tip="${esc(tipFor(f))}" /></td>`;
      return `<td><input class="cell-input" data-r="${ri}" data-c="${esc(c)}" value="${esc(row[c]||"")}" data-tip="${esc(tipFor(f))}" /></td>`;
    }).join("");
    return `<tr>${cells}<td><button type="button" class="btn" data-del="${ri}">×</button></td></tr>`;
  }).join("");
  const intro=kind==="REWARD-LINK"
    ? "Задайте связи конкурса с наградами: CONTEST_CODE фиксирован. Укажите REWARD_CODE здесь — на шаге «Награды» выберете их для BADGE."
    : "Строки SPOD. CONTEST_CODE всегда из шага «Конкурс» и не редактируется.";
  $("workspace").innerHTML=`<section class="panel"><h2>${esc(title)}</h2><p class="intro">${intro}</p><div class="table-wrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="table-actions"><button type="button" class="btn btn-primary" id="btn-add-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Добавить строку</button></div></section>`;
  $("workspace").querySelectorAll(".cell-input").forEach(el=>{
    const sync=()=>{
      const r=Number(el.getAttribute("data-r"));const c=el.getAttribute("data-c");
      if(c==="CONTEST_CODE")return;
      data()[rowsKey][r][c]=el.value;
      persistLocal();refreshContestTabDirty();
    };
    el.addEventListener("input",sync);el.addEventListener("change",()=>{sync();refreshContestTabDirty()});
  });
  $("workspace").querySelectorAll(".chips").forEach(box=>{
    box.querySelectorAll(".default-chip").forEach(btn=>btn.addEventListener("click",()=>{
      const r=Number(box.getAttribute("data-r"));const c=box.getAttribute("data-c");const v=btn.getAttribute("data-v");
      if(c==="CONTEST_CODE")return;
      const f=meta(secId,c);const cur=data()[rowsKey][r][c];
      if(cur===v){
        if(selectionRequired(f)){toast("«Можно пусто» = нет — значение должно быть выбрано");return}
        data()[rowsKey][r][c]="";
      }else data()[rowsKey][r][c]=v;
      if(rowsKey==="group"&&c==="GROUP_CODE") pruneLinkGroupCodes(data());
      persistLocal();render();
    }));
  });
  $("workspace").querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click",()=>{
    const r=Number(btn.getAttribute("data-del"));
    data()[rowsKey].splice(r,1);
    if(!data()[rowsKey].length){const row=Object.fromEntries(cols.map(c=>[c,""]));row.CONTEST_CODE=cc;data()[rowsKey].push(row)}
    if(rowsKey==="group") pruneLinkGroupCodes(data());
    persistLocal();render();
  }));
  $("btn-add-row").addEventListener("click",()=>{
    const row=Object.fromEntries(cols.map(c=>[c,""]));
    row.CONTEST_CODE=cc;
    data()[rowsKey].push(row);persistLocal();render();
  });
}

function render(){
  if(!catalog||!contests.length)return;
  syncBadgeSlots(data(),false);
  seedLinked(data());
  normalizeActiveSection();
  renderContestTabs();renderNav();
  if(activeSection==="CONTEST")renderContest();
  else if(activeSection==="CONTEST_FEATURE")renderFeature();
  else if(activeSection.startsWith("ADD:"))renderRewardAdd();
  else if(activeSection.startsWith("PAIR:")||activeSection.startsWith("BADGE:")||activeSection.startsWith("LINK:")||activeSection==="REWARD-LINK")renderLinkRewardPair();
  else if(activeSection==="GROUP"||activeSection.startsWith("GROUP:"))renderGroup();
  else if(activeSection==="INDICATOR"||activeSection.startsWith("INDICATOR:"))renderIndicator();
  else if(activeSection==="SCHEDULE"||activeSection.startsWith("SCHEDULE:"))renderSchedule();
  realignBaselineIfPristine(cur());
}

function dumpsSpod(obj){if(obj===null||obj===undefined)return"null";if(typeof obj==="boolean")return obj?"true":"false";if(typeof obj==="number")return Number.isInteger(obj)?String(obj):String(obj);if(typeof obj==="string")return'"""'+obj+'"""';if(Array.isArray(obj)){if(!obj.length)return"[]";return"["+obj.map(dumpsSpod).join(", ")+"]"}if(typeof obj==="object"){const keys=Object.keys(obj);if(!keys.length)return"{}";return"{"+keys.map(k=>dumpsSpod(String(k))+": "+dumpsSpod(obj[k])).join(", ")+"}"}return'"""'+String(obj)+'"""'}
function featureObject(d){const out={};const fields=(catalog.sections.find(s=>s.id==="CONTEST_FEATURE")||{fields:[]}).fields;for(const f of fields){const storeLeaf=jsonStoreLeaf(f,"CONTEST_FEATURE","FEATURE");const packLeaf=jsonPackLeaf(f,"CONTEST_FEATURE");const raw=d.feature[storeLeaf];if(raw===undefined||raw==="")continue;if(f.kind==="list")out[packLeaf]=listFromCell(raw);else if(packLeaf==="accuracy"||packLeaf==="minNumber"){const n=Number(raw);out[packLeaf]=Number.isFinite(n)?n:raw}else out[packLeaf]=String(raw)}return out}
function addObject(add){const out={};const fields=(catalog.sections.find(s=>s.id==="REWARD_ADD_DATA")||{fields:[]}).fields;for(const f of fields){const storeLeaf=jsonStoreLeaf(f,"REWARD_ADD_DATA","ADD");const packLeaf=jsonPackLeaf(f,"REWARD_ADD_DATA");const raw=add[storeLeaf];if(raw===undefined||raw==="")continue;if(f.kind==="list")out[packLeaf]=listFromCell(raw);else out[packLeaf]=String(raw)}return out}
function contestRow(d){const row={};for(const c of CONTEST_CSV_COLS)row[c]="";for(const[k,v] of Object.entries(d.contest)){if(k==="BUSINESS_BLOCK"||k==="CONTEST_PERIOD")row[k]=dumpsSpod(listFromCell(v));else if(CONTEST_CSV_COLS.includes(k))row[k]=String(v??"")}row.CONTEST_FEATURE=dumpsSpod(featureObject(d));return row}
function rewardRows(d){return d.badges.map(b=>{const row={};for(const c of REWARD_CSV_COLS)row[c]="";for(const[k,v] of Object.entries(b.flat)){if(REWARD_CSV_COLS.includes(k))row[k]=String(v??"")}if(!row.REWARD_TYPE)row.REWARD_TYPE="BADGE";row.REWARD_ADD_DATA=dumpsSpod(addObject(b.add));return row})}
function tableRows(rows,cols){return rows.filter(r=>cols.some(c=>String(r[c]||"").trim())).map(r=>{const out={};cols.forEach(c=>out[c]=String(r[c]??""));return out})}
function csvEscape(val){const s=String(val??"");if(/[;"\n\r]/.test(s))return'"'+s.replace(/"/g,'""')+'"';return s}
function toCsv(rows,cols){const lines=[cols.join(";")];for(const row of rows)lines.push(cols.map(c=>csvEscape(row[c])).join(";"));return lines.join("\r\n")+"\r\n"}
function downloadCsv(filename,text){const bom=new Uint8Array([0xef,0xbb,0xbf]);const body=new TextEncoder().encode(text);const bytes=new Uint8Array(bom.length+body.length);bytes.set(bom,0);bytes.set(body,bom.length);const blob=new Blob([bytes],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
function fileName(key){const map={contest:`CONTEST (${BLOCK}) FORM_FILL.csv`,reward:`REWARD (${BLOCK}) FORM_FILL.csv`,reward_link:`REWARD-LINK (${BLOCK}) FORM_FILL.csv`,group:`GROUP (${BLOCK}) FORM_FILL.csv`,indicator:`INDICATOR (${BLOCK}) FORM_FILL.csv`,schedule:`SCHEDULE (${BLOCK}) FORM_FILL.csv`};return map[key]}
function buildTables(){
  const tables={contest:[],reward:[],reward_link:[],group:[],indicator:[],schedule:[]};
  const seen=new Set();
  for(const c of contests){
    const d=c.data;tables.contest.push(contestRow(d));
    for(const r of rewardRows(d)){const code=r.REWARD_CODE||"";if(code&&seen.has(code))continue;if(code)seen.add(code);tables.reward.push(r)}
    tables.reward_link.push(...tableRows(d.reward_link,LINK_COLS));
    tables.group.push(...tableRows(d.group,GROUP_COLS));
    tables.indicator.push(...tableRows(d.indicator,IND_COLS));
    tables.schedule.push(...tableRows(d.schedule,SCH_COLS));
  }
  return tables;
}
function exportOne(key){const tables=buildTables();const cols={contest:CONTEST_CSV_COLS,reward:REWARD_CSV_COLS,reward_link:LINK_COLS,group:GROUP_COLS,indicator:IND_COLS,schedule:SCH_COLS}[key];downloadCsv(fileName(key),toCsv(tables[key],cols));toast("CSV: "+fileName(key))}
async function exportAll(){for(const k of ["contest","reward","reward_link","group","indicator","schedule"]){exportOne(k);await new Promise(r=>setTimeout(r,220))}toast("Все 6 CSV (UTF-8 BOM · ;)")}

function catalogStamp(data){return String((data&&(data.exported_at||data.generated_at||data.version))||"")}
async function loadCatalogPreferFile(){
  try{
    const url=new URL(CATALOG_URL, window.location.href).href;
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.sections)) throw new Error("нет sections");
    return {data, source:"catalog.json"};
  }catch(_){
    return {data:EMBEDDED_CATALOG, source:"embedded"};
  }
}
let sessionReady=false;
let sidebarOpen=true;

function setSidebarOpen(open){
  sidebarOpen=!!open;
  const app=document.querySelector(".app");
  if(app) app.classList.toggle("is-sidebar-collapsed",!sidebarOpen);
  const hide=$("btn-sidebar-hide");
  const show=$("btn-sidebar-show");
  if(hide) hide.setAttribute("aria-expanded",sidebarOpen?"true":"false");
  if(show) show.setAttribute("aria-expanded",sidebarOpen?"true":"false");
}
let catalogSource="embedded";

function projectPayload(){return{version:2,block:BLOCK,saved_at:new Date().toISOString(),catalog_stamp:catalogStamp(catalog),activeContest,contests:contests.map(c=>({id:c.id,name:contestTitle(c,0),data:c.data}))}}
function persistLocal(){if(!sessionReady)return;try{localStorage.setItem(LS_PROJECT,JSON.stringify(projectPayload()))}catch(_){}}
function saveProjectFile(){
  if(!sessionReady||!contests.length){toast("Сначала создайте или откройте конкурс");return}
  const text=JSON.stringify(projectPayload(),null,2)+"\n";
  const blob=new Blob([text],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
  a.href=URL.createObjectURL(blob);a.download=`spod_fill_${stamp}.json`;a.click();URL.revokeObjectURL(a.href);
  toast("Снимок JSON сохранён");
}
function peekDraft(){
  let restored=null;try{restored=JSON.parse(localStorage.getItem(LS_PROJECT)||"null")}catch(_){}
  if(!restored||!Array.isArray(restored.contests)||!restored.contests.length)return null;
  const stamp=catalogStamp(catalog);
  const saved=String(restored.catalog_stamp||"");
  if(stamp&&saved&&saved!==stamp){
    try{localStorage.removeItem(LS_PROJECT)}catch(_){}
    return null;
  }
  return restored;
}
function applyProjectObject(restored, opts){
  opts=opts||{};
  if(!restored||!Array.isArray(restored.contests)||!restored.contests.length)throw new Error("В файле нет contests[]");
  contests=restored.contests.map((c,i)=>{
    const data=c.data||emptyContestData();
    expandContestPrefixedCodes(data);
    syncBadgeSlots(data,false);
    seedLinked(data);
    sortScheduleRows(data.schedule);
    const item={id:c.id||("c"+Date.now()+"_"+i),name:c.name||"",data,baseline:null,userEdited:false};
    markBaseline(item);
    return item;
  });
  activeContest=Math.min(Math.max(0,Number(restored.activeContest||0)),contests.length-1);
  activeSection="CONTEST";activeBadge=0;activeSchedule=0;activeIndicator=0;activeGroup=0;activeLink=0;
  sessionReady=true;
  setGated(false);
  persistLocal();
  render();
  updatePageIntro(catalogSource);
  if(opts.toast)toast(opts.toast);
}
function restoreDraftIfAny(){
  const restored=peekDraft();
  if(!restored)return false;
  try{applyProjectObject(restored,{toast:"Черновик из браузера"});return true}catch(_){return false}
}
function startFresh(opts){
  opts=opts||{};
  contests=[];
  const data=emptyContestData();
  const c={id:"c"+Date.now(),name:"",data,baseline:null,userEdited:false};
  markBaseline(c);
  contests.push(c);
  activeContest=0;activeSection="CONTEST";activeBadge=0;activeSchedule=0;activeIndicator=0;activeGroup=0;activeLink=0;
  sessionReady=true;
  setGated(false);
  persistLocal();
  render();
  updatePageIntro(catalogSource);
  toast(opts.toast||"Новый конкурс · значения по умолчанию из каталога");
}
function addContest(){
  if(!sessionReady){toast("Сначала выберите: открыть JSON или создать новый");return}
  const data=emptyContestData();
  const c={id:"c"+Date.now(),name:"",data,baseline:null,userEdited:false};
  markBaseline(c);
  contests.push(c);
  activeContest=contests.length-1;activeSection="CONTEST";activeBadge=0;activeSchedule=0;activeIndicator=0;activeGroup=0;activeLink=0;
  persistLocal();render();toast("Добавлен конкурс");
}
function resetToCatalogDefaults(){
  if(!confirm("Сбросить все конкурсы и заново взять значения по умолчанию из текущего каталога?\nОписания и варианты всегда из каталога; сброс касается заполненных значений."))return;
  try{localStorage.removeItem(LS_PROJECT)}catch(_){}
  startFresh({toast:"Сброшено к дефолтам каталога"});
}
function importProjectText(text){
  const data=JSON.parse(text);
  applyProjectObject(data,{toast:"Загружен снимок JSON ("+data.contests.length+" конкурс.)"});
}
function onImportProjectFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{importProjectText(String(reader.result||""))}
    catch(err){toast("Не удалось открыть JSON: "+(err&&err.message?err.message:err))}
  };
  reader.onerror=()=>toast("Ошибка чтения файла");
  reader.readAsText(file,"utf-8");
}
function setGated(on){
  document.querySelector(".app")?.classList.toggle("is-gated",!!on);
}
function showStartGate(){
  sessionReady=false;
  contests=[];
  setGated(true);
  const draft=peekDraft();
  const nDraft=draft?draft.contests.length:0;
  $("workspace").innerHTML=`
    <section class="start-gate" id="start-gate">
      <h2 class="start-gate__title">С чего начнём?</h2>
      <p class="start-gate__text">
        Можно открыть ранее сохранённые настройки конкурсов (снимок JSON)
        или создать новый конкурс с полями и значениями по умолчанию из каталога.
      </p>
      <div class="start-gate__actions">
        <label class="btn btn-primary file-pick" id="gate-import-label" data-tip="Файл spod_fill_….json, сохранённый кнопкой «Сохранить снимок JSON»">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>
          <span>Открыть сохранённые настройки (JSON)</span>
          <input type="file" id="gate-import-project" class="file-pick__input" accept=".json,application/json,text/json,text/plain" />
        </label>
        <button type="button" class="btn btn-sidebar" id="gate-fresh" data-tip="Один пустой конкурс с дефолтами каталога и шагами заполнения">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Создать новый конкурс с нуля
        </button>
        ${draft?`<button type="button" class="btn btn-sidebar" id="gate-draft" data-tip="Продолжить незавершённый черновик из этого браузера (${nDraft} конкурс.)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Продолжить черновик (${nDraft})
        </button>`:""}
      </div>
      <p class="start-gate__hint">После старта слева появятся шаги заполнения. Снимок можно снова открыть в блоке «Проект».</p>
    </section>`;
  $("gate-fresh")?.addEventListener("click",()=>startFresh());
  $("gate-draft")?.addEventListener("click",()=>{if(!restoreDraftIfAny())toast("Черновик недоступен")});
  $("gate-import-project")?.addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];
    onImportProjectFile(f);
    e.target.value="";
  });
  renderContestTabs();
  renderNav();
}
function updatePageIntro(source){
  const stamp=catalogStamp(catalog);
  const short=stamp?stamp.replace("T"," ").replace(/\.\d+Z$/," UTC"):"—";
  const text=sessionReady
    ?`Каталог: ${source||"embedded"} · ${short} · дефолты и описания из каталога`
    :`Каталог: ${source||"embedded"} · ${short} · выберите: открыть JSON или создать новый конкурс`;
  const intro=$("page-intro");
  if(intro){
    intro.textContent=text;
    intro.title=text;
  }
  const meta=document.querySelector(".foot-block--meta");
  if(meta) meta.title="Заполнение параметров SPOD · "+text;
}
async function boot(){
  const loaded=await loadCatalogPreferFile();
  catalog=loaded.data;
  catalogSource=loaded.source;
  if(!catalog||!Array.isArray(catalog.sections)){
    $("workspace").innerHTML=`<section class="panel"><h2>Нет каталога</h2><p class="intro">Нужен <code>catalog.json</code> рядом со страницей или блок EMBEDDED_CATALOG.</p></section>`;
    return;
  }
  showStartGate();
  updatePageIntro(catalogSource);
  toast(loaded.source==="catalog.json"?"Каталог готов · выберите старт":"Встроенный каталог · выберите старт");
}

function initTips(){const tip=$("glassTip");document.addEventListener("mousemove",e=>{const node=e.target.closest("[data-tip]");if(!node){tip.classList.remove("show");return}const text=node.getAttribute("data-tip")||"";if(!text.trim()){tip.classList.remove("show");return}tip.textContent=text;tip.classList.add("show");let left=e.clientX+14,top=e.clientY+14;const r=tip.getBoundingClientRect();if(left+r.width>innerWidth-8)left=innerWidth-r.width-8;if(top+r.height>innerHeight-8)top=e.clientY-r.height-8;tip.style.left=Math.max(8,left)+"px";tip.style.top=Math.max(8,top)+"px"},true)}
function wireOutsideDate(){
  document.addEventListener("pointerdown",e=>{const open=document.querySelector(".date-pop.is-open");if(!open)return;if(e.target.closest(".date-pop")||e.target.closest(".default-date"))return;closeAllDatePops()},true);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      closeAllDatePops();
      return;
    }
    if((e.key==="b"||e.key==="B")&&(e.metaKey||e.ctrlKey)&&!e.altKey){
      const t=e.target;
      if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
      e.preventDefault();
      setSidebarOpen(!sidebarOpen);
    }
  });
}

function wire(){
  initTips();wireOutsideDate();
  setSidebarOpen(true);
  $("btn-sidebar-hide")?.addEventListener("click",()=>setSidebarOpen(false));
  $("btn-sidebar-show")?.addEventListener("click",()=>setSidebarOpen(true));
  $("btn-add-contest").addEventListener("click",()=>addContest());
  $("btn-save-project").addEventListener("click",()=>saveProjectFile());
  $("btn-reset-catalog").addEventListener("click",()=>resetToCatalogDefaults());
  $("btn-export-all").addEventListener("click",()=>{if(!sessionReady){toast("Сначала создайте или откройте конкурс");return}exportAll()});
  document.querySelectorAll("[data-export]").forEach(btn=>btn.addEventListener("click",()=>{if(!sessionReady){toast("Сначала создайте или откройте конкурс");return}exportOne(btn.getAttribute("data-export"))}));
  $("import-project")?.addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];
    onImportProjectFile(f);
    e.target.value="";
  });
  $("contest-search")?.addEventListener("input",e=>{
    contestListQuery=String(e.target.value||"");
    renderContestTabs();
  });
  $("filter-tournaments")?.addEventListener("click",()=>{
    contestListShowTournament=!contestListShowTournament;
    renderContestTabs();
  });
  $("filter-rewards")?.addEventListener("click",()=>{
    contestListShowReward=!contestListShowReward;
    renderContestTabs();
  });
}
wire();boot();
})();

</script>
