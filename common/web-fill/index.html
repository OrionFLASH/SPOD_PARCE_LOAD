<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Заполнение SPOD — Герои продаж (Геймификация)</title>
<style>
:root {
  --glass-bg-gradient: linear-gradient(165deg, #e8eef8 0%, #f5f0ea 42%, #e9f2f0 100%);
  --glass-white: rgba(255,255,255,.78);
  --glass-border: rgba(255,255,255,.72);
  --glass-text: #1c2434;
  --glass-muted: #5a6578;
  --glass-blue: #007aff;
  --glass-blue-hover: #0066d6;
  --glass-blue-light: rgba(0,122,255,.14);
  --glass-blue-border: rgba(0,122,255,.4);
  --glass-orange: #ff9500;
  --glass-green: #34c759;
  --glass-shadow: 0 8px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04), inset 0 1px 0 rgba(255,255,255,.9);
  --glass-shadow-hover: 0 14px 44px rgba(0,0,0,.12), 0 4px 14px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.95);
  --radius: 18px;
  --font: "SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --blur: 18px;
  --kind-dropdown: #c6efce;
  --kind-dropdown-custom: #b2f5ea;
  --kind-text: #fff2cc;
  --kind-list: #fce4d6;
  --kind-json: #f5b7b1;
  --kind-date: #ddebff;
  --kind-number: #e8daef;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--glass-text);background:var(--glass-bg-gradient);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.5}
body::before{width:420px;height:420px;left:-80px;top:-60px;background:#a8c8ff}
body::after{width:380px;height:380px;right:-60px;bottom:10%;background:#ffd4a8}
/* superseded: old .app grid */
/* superseded: old sidebar */
.brand-mark{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--glass-blue);text-transform:uppercase}
.brand-title{margin:6px 0 2px;font-size:18px;font-weight:700;letter-spacing:-.03em}
.brand-sub{font-size:12px;color:var(--glass-muted)}
.brand-sub code,.hint code{font-family:var(--mono);font-size:.9em;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.06)}
.side-block-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-muted);margin:8px 4px 6px}
.contest-tabs{display:flex;flex-direction:column;gap:10px}
.contest-tabs-group{display:flex;flex-direction:column;gap:6px}
.contest-tabs-group__title{font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--glass-muted);padding:2px 4px 0}
.contest-tab{display:flex;align-items:center;gap:6px;width:100%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.55);border-radius:14px;padding:6px 10px;cursor:pointer;font:inherit;text-align:left;min-height:0}
.contest-tab.active{font-weight:600}
.contest-tab.is-dirty{box-shadow:0 0 0 2px rgba(255,149,0,.5)}
.contest-tab .ct-text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.15}
.contest-tab .ct-code{display:block;font-size:12px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contest-tab .ct-fullname{display:block;font-size:9px;font-weight:500;opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contest-tab .ct-fullname:empty{display:none}
.contest-tab .ct-x{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;opacity:.55;padding:2px 6px;border-radius:8px;flex:0 0 auto;align-self:center}
.contest-tab .ct-x:hover{opacity:1;background:rgba(0,0,0,.06)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.5);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.nav-btn:hover{background:rgba(255,255,255,.85);box-shadow:var(--glass-shadow)}
.nav-btn.active{background:var(--glass-blue-light);border-color:var(--glass-blue-border);color:var(--glass-blue);font-weight:600}
.nav-btn .tag{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.06);flex-shrink:0}
.nav-btn .tag.json{background:rgba(192,57,43,.12);color:#c0392b}
.nav-btn .tag.table{background:rgba(0,122,255,.12);color:var(--glass-blue)}
.nav-btn--slot{padding:7px 10px;gap:6px;border-radius:12px}
.nav-btn--slot .nav-btn__title{display:block;font-size:11px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn--slot .nav-sub{font-size:9px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn--slot .tag{font-size:8px;padding:1px 5px}
.nav-group{margin:10px 0 4px;padding:6px 10px 4px;border-radius:10px;background:rgba(15,23,42,.04);border:1px solid rgba(15,23,42,.06)}
.nav-group:first-child{margin-top:0}
.nav-group__title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--glass-text)}
.nav-group__meta{font-size:9px;font-weight:600;color:var(--glass-muted);text-transform:none;letter-spacing:0}
.nav-group--link{background:rgba(0,122,255,.07);border-color:rgba(0,122,255,.14)}
.nav-group--link .nav-group__title{color:#0066d6}
.nav-group--pair{background:linear-gradient(90deg,rgba(0,122,255,.07),rgba(52,199,89,.08));border-color:rgba(15,23,42,.1)}
.nav-group--pair .nav-group__title{color:var(--glass-text)}
.pair-block{margin:0 0 16px;padding:14px 14px 4px;border-radius:16px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.55)}
.pair-block--link{border-color:rgba(0,122,255,.22);background:rgba(0,122,255,.04)}
.pair-block--reward{border-color:rgba(52,199,89,.25);background:rgba(52,199,89,.04)}
.pair-block__label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.pair-block--link .pair-block__label{color:#0066d6}
.pair-block--reward .pair-block__label{color:#15803d}
.pair-block__hint{font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--glass-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.75);border-radius:14px;padding:10px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.65);box-shadow:var(--glass-shadow);color:var(--glass-text)}
.btn:hover{background:#fff;box-shadow:var(--glass-shadow-hover);color:var(--glass-text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#4aa3ff 0%,var(--glass-blue) 100%);color:#fff;border-color:transparent}
.btn-primary:hover{background:linear-gradient(180deg,#5aabff 0%,#1a7aef 100%);color:#fff;filter:none;box-shadow:var(--glass-shadow-hover)}
.btn-sidebar{width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn-primary svg{stroke:#fff}
.main{padding:0;min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.main-sticky{flex:0 0 auto;position:sticky;top:0;z-index:40;padding:18px 22px 0;background:linear-gradient(180deg,rgba(245,247,250,.96) 0%,rgba(245,247,250,.88) 70%,rgba(245,247,250,.55) 100%);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px;padding:16px 18px;border-radius:var(--radius);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.85);box-shadow:var(--glass-shadow)}
.topbar h1{margin:0;font-size:clamp(1.2rem,2vw,1.55rem);letter-spacing:-.03em}
.topbar p{margin:6px 0 0;color:var(--glass-muted);font-size:14px;max-width:56ch;line-height:1.45}
.flow-strip-host{margin:0 0 12px}
.flow-strip-host[hidden]{display:none!important}
.workspace{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;padding:0 22px 40px;scroll-padding-top:8px}
.panel{padding:18px;border-radius:var(--radius);background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.85);box-shadow:var(--glass-shadow-hover);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);margin-bottom:16px}
.panel h2{margin:0 0 6px;font-size:17px}
.panel .intro{margin:0 0 14px;color:var(--glass-muted);font-size:13px;line-height:1.45}

.flow-strip{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.85);box-shadow:var(--glass-shadow)}
.flow-step{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--glass-muted);background:rgba(255,255,255,.55);border:1px solid transparent}
.flow-step.is-on{color:var(--glass-blue);background:var(--glass-blue-light);border-color:var(--glass-blue-border)}
.flow-step__n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.06)}
.flow-step.is-on .flow-step__n{background:var(--glass-blue);color:#fff}
.type-callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 16px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(0,122,255,.12),rgba(52,199,89,.1));border:1px solid rgba(0,122,255,.28);box-shadow:0 4px 16px rgba(0,122,255,.08)}
.type-callout__title{font-size:13px;font-weight:700}
.type-callout__meta{font-size:12px;color:var(--glass-muted);line-height:1.4}
.type-callout__badge{margin-left:auto;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid rgba(0,122,255,.25);color:var(--glass-blue)}
.group-card{margin:0 0 16px;padding:16px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid rgba(15,23,42,.08);box-shadow:0 2px 12px rgba(15,23,42,.04)}
.group-card__head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin:0 0 12px}
.group-card__title{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em}
.group-card__hint{margin:0;font-size:12px;color:var(--glass-muted);line-height:1.4;max-width:70ch}
.fields-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.field{display:grid;gap:8px;padding:14px 15px;border-radius:16px;background:rgba(255,255,255,.94);border:1px solid rgba(15,23,42,.14);box-shadow:0 3px 14px rgba(15,23,42,.07),inset 0 1px 0 rgba(255,255,255,.9);transition:box-shadow .15s,border-color .15s,background .15s;grid-column:span 12;min-width:0}
.field.span-6{grid-column:span 6}
.field.span-4{grid-column:span 4}
.field.span-8{grid-column:span 8}
.field.span-3{grid-column:span 3}
.field.span-12,.field.span-full{grid-column:span 12}
.field--hero{padding:18px;border-color:rgba(0,122,255,.35);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(232,242,255,.95));box-shadow:0 0 0 2px rgba(0,122,255,.12),0 8px 24px rgba(0,122,255,.1)}
.field--hero .field-label{font-size:15px}
.field:hover{background:#fff;border-color:rgba(15,23,42,.2);box-shadow:0 6px 18px rgba(15,23,42,.1)}
.field.is-edited{background:rgba(255,248,240,.96);border-color:rgba(255,149,0,.45);box-shadow:0 0 0 2px rgba(255,149,0,.28),0 4px 14px rgba(255,149,0,.08)}
.field.is-focus{border-color:rgba(0,122,255,.45);box-shadow:0 0 0 2px rgba(0,122,255,.28)}
.field.is-edited.is-focus{box-shadow:0 0 0 2px rgba(255,149,0,.4),0 0 0 5px rgba(0,122,255,.22)}
.field-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.field-label{font-size:13px;font-weight:700;letter-spacing:-.01em;order:0}
.field-key{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--glass-muted);order:2;opacity:.85}
.json-fact{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-family:var(--mono);font-size:10px;font-weight:600;color:#7a3aa0;background:rgba(175,82,222,.12);border:1px solid rgba(175,82,222,.22);white-space:nowrap;max-width:min(280px,100%);overflow:hidden;text-overflow:ellipsis;order:3}
.edited-badge{display:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,149,0,.18);border:1px solid rgba(255,149,0,.35);color:#c2410c;order:1}
.field.is-edited .edited-badge{display:inline-flex}
.empty-pill{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;letter-spacing:.01em;order:1;white-space:nowrap}
.empty-pill.is-req{background:rgba(255,59,48,.1);border-color:rgba(255,59,48,.32);color:#b91c1c}
.empty-pill.is-opt{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.3);color:#15803d}
.kind-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid rgba(0,0,0,.05);opacity:.7;order:4;margin-left:auto}
.kind-pill.dropdown{background:var(--kind-dropdown)}
.kind-pill.dropdown_custom{background:var(--kind-dropdown-custom)}
.kind-pill.text{background:var(--kind-text)}
.custom-variant{display:grid;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(15,23,42,.12)}
.custom-variant__label{font-size:11px;font-weight:700;color:var(--glass-muted)}
.custom-variant.is-on .custom-variant__label{color:#0f766e}
.custom-variant input{width:100%;padding:9px 11px;border-radius:11px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.95);font:inherit;font-size:13px}
.custom-variant.is-on input{border-color:rgba(15,118,110,.45);box-shadow:0 0 0 2px rgba(20,184,166,.18)}
.kind-pill.list{background:var(--kind-list)}
.kind-pill.json{background:var(--kind-json)}
.kind-pill.date{background:var(--kind-date)}
.kind-pill.number{background:var(--kind-number)}
.field-desc{font-size:12px;color:var(--glass-muted);line-height:1.4}
.field input[type=text],.field textarea,.cell-input{width:100%;padding:9px 11px;border-radius:11px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.95);font:inherit;font-size:13px}
.list-freeform textarea{width:100%;min-height:72px;padding:9px 11px;border-radius:11px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.95);font:inherit;font-size:13px;resize:vertical}
.list-freeform textarea:focus{outline:2px solid rgba(0,122,255,.35);border-color:rgba(0,122,255,.45)}
.field input:focus,.field textarea:focus,.cell-input:focus{outline:2px solid rgba(0,122,255,.35);border-color:rgba(0,122,255,.45)}
.chips,.default-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr));gap:8px;width:100%;align-items:stretch}
.field-control .default-checks{margin:0}
.default-chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:40px;max-width:100%;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.85);border-radius:12px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--glass-text);text-align:center;box-sizing:border-box;line-height:1.25}
.default-chip:hover{background:#fff;box-shadow:var(--glass-shadow)}
.default-chip.is-on{background:rgba(0,122,255,.14);border-color:rgba(0,122,255,.4);color:var(--glass-blue)}
.default-checks--single .default-chip.is-on{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.45);color:#1e8449}
.default-chip__label{display:block;width:100%;text-align:center;overflow-wrap:anywhere}
.default-chip__text{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;line-height:1.15;min-width:0}
.default-chip__code{display:block;font-family:var(--mono);font-size:10px;font-weight:600;opacity:.55;letter-spacing:.01em}
.default-chip__mark{display:none;position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px}
.default-chip.is-on .default-chip__mark{display:inline-flex}
.default-chip.is-on{padding-left:28px;padding-right:28px}
.default-chip__mark svg{width:12px;height:12px}
td .chips{grid-template-columns:repeat(auto-fit,minmax(4.5rem,1fr));gap:6px}
td .default-chip{min-height:34px;padding:6px 8px;font-size:11px}
.period-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.period-bar__actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:0 0 auto}
.period-tabs{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.period-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.8);border-radius:14px;padding:8px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--glass-text);max-width:100%}
.period-tab.active{background:var(--glass-blue-light);border-color:var(--glass-blue-border);color:var(--glass-blue);box-shadow:0 0 0 2px rgba(0,122,255,.16)}
.period-tab--sch-active{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.4);color:#15803d}
.period-tab--sch-active.active{box-shadow:0 0 0 2px rgba(52,199,89,.28)}
.period-tab--sch-results{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.4);color:var(--glass-blue)}
.period-tab--sch-results.active{box-shadow:0 0 0 2px rgba(0,122,255,.28)}
.period-tab--sch-done{background:rgba(244,114,182,.16);border-color:rgba(219,39,119,.38);color:#be185d}
.period-tab--sch-done.active{box-shadow:0 0 0 2px rgba(219,39,119,.28)}
.period-tab--sch-cancel,
.period-tab--sch-deleted{background:rgba(148,163,184,.16);border-color:rgba(100,116,139,.4);color:#64748b}
.period-tab--sch-deleted{opacity:.88}
.period-tab--sch-cancel.active,
.period-tab--sch-deleted.active{box-shadow:0 0 0 2px rgba(100,116,139,.28)}
.period-tab .pt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.period-tab .pt-x{border:0;background:transparent;cursor:pointer;opacity:.5;font-size:16px;line-height:1;padding:0 2px;border-radius:6px}
.period-tab .pt-x:hover{opacity:1;background:rgba(0,0,0,.06)}
.period-meta{font-size:12px;color:var(--glass-muted);margin:0 0 12px;line-height:1.45}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin:0 0 6px}
.panel-head h2{margin:0}
.ctx-pills{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:flex-end}
.ctx-pill{display:inline-flex;align-items:center;gap:5px;max-width:min(100%,280px);padding:3px 8px 3px 6px;border-radius:999px;background:rgba(15,23,42,.045);border:1px solid rgba(15,23,42,.1);line-height:1.2}
.ctx-pill__k{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--glass-muted);flex-shrink:0}
.ctx-pill__v{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--glass-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-pill.is-empty .ctx-pill__v{color:var(--glass-muted);font-weight:600}
.ctx-pick-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.ctx-pick-row__label{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--glass-muted)}
.ctx-pick-chip{border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;font:inherit;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;color:var(--glass-text)}
.ctx-pick-chip:hover{background:#fff;border-color:rgba(0,122,255,.35)}
.ctx-pick-chip.is-on{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.45);color:#1e8449}
.code-composite{display:flex;align-items:stretch;width:100%;min-height:40px;border-radius:11px;border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.95);overflow:hidden}

.default-date{display:flex;flex-direction:column;gap:0}

.default-date__chip-icon svg{width:14px;height:14px}
.date-pop{position:fixed;z-index:10050;width:19.5rem;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.98);box-shadow:var(--glass-shadow-hover);backdrop-filter:blur(18px);box-sizing:border-box}

.badge-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.nav-btn__body{flex:1;min-width:0;text-align:left}
.table-wrap{overflow:auto;border-radius:14px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.55)}

.start-gate__title{margin:0 0 8px;font-size:18px;font-weight:750;letter-spacing:-.02em}

/* layout chrome */
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.chrome-top{flex:0 0 auto;z-index:50;padding:8px 14px 8px;background:linear-gradient(180deg,rgba(245,247,250,.97) 0%,rgba(245,247,250,.92) 75%,rgba(245,247,250,.78) 100%);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(15,23,42,.06)}
.chrome-top:has(#section-nav[hidden]){padding:0;border:0;box-shadow:none;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.chrome-mid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side-w,304px) minmax(0,1fr);overflow:hidden;transition:grid-template-columns .28s ease}
.sidebar{height:100%;min-height:0;min-width:0;width:100%;padding:12px 10px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;background:rgba(255,255,255,.82);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border-right:1px solid var(--glass-border);box-shadow:var(--glass-shadow);transition:opacity .22s ease,transform .28s ease,padding .28s ease,border-color .28s ease}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;min-width:0;margin:0 0 2px}
.side-block-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--glass-muted);margin:0 4px;flex:1 1 auto;min-width:0}
.btn-side-toggle{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:1px solid rgba(15,23,42,.1);border-radius:10px;background:rgba(255,255,255,.75);color:var(--glass-muted);cursor:pointer;font:inherit}
.btn-side-toggle:hover{background:rgba(255,255,255,.98);color:var(--glass-blue);border-color:var(--glass-blue-border);box-shadow:var(--glass-shadow)}
.btn-side-toggle svg{width:16px;height:16px;display:block}
.sidebar-reopen{position:fixed;left:0;top:50%;z-index:70;transform:translateY(-50%);display:none;align-items:center;gap:6px;margin:0;padding:10px 8px 10px 6px;border:1px solid rgba(255,255,255,.85);border-left:0;border-radius:0 14px 14px 0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);box-shadow:var(--glass-shadow-hover);color:var(--glass-blue);cursor:pointer;font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;writing-mode:vertical-rl;text-orientation:mixed}
.sidebar-reopen svg{width:14px;height:14px;display:block;transform:rotate(90deg)}
.sidebar-reopen:hover{background:#fff;padding-right:10px}
.app.is-sidebar-collapsed{--side-w:0px}
.app.is-sidebar-collapsed .sidebar{opacity:0;transform:translateX(-12px);pointer-events:none;padding:0;border-color:transparent;box-shadow:none}
.app.is-sidebar-collapsed .chrome-top,
.app.is-sidebar-collapsed .chrome-foot{display:none!important}
.app.is-sidebar-collapsed .sidebar-reopen{display:inline-flex}

.app.is-sidebar-collapsed .toast{bottom:20px!important}
.contest-tabs-scroll{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;padding-right:2px}

function renderGrouped(sectionId, layout, getValue, setValue, pathOf, omitKeys){
  const map=fieldsByKey(sectionId);
  const omit=new Set(omitKeys||[]);
  const used=new Set(omit);
  const root=document.createElement("div");
  for(const g of layout){
    const card=document.createElement("section");card.className="group-card";
    card.innerHTML=`<div class="group-card__head"><h3 class="group-card__title">${esc(g.title)}</h3>${g.hint?`<p class="group-card__hint">${esc(g.hint)}</p>`:""}</div><div class="fields-grid"></div>`;
    const grid=card.querySelector(".fields-grid");
    for(const it of g.items){
      if(omit.has(it.key)) continue;
      const base=map[it.key];if(!base)continue;used.add(it.key);
      const f=it.label?Object.assign({},base,{label:it.label}):base;
      const cardEl=renderFieldCard(f,getValue(base),pathOf(base),v=>setValue(base,v),{
        span:it.span||12,hero:!!it.hero,locked:!!it.locked,pickVariants:it.pickVariants||null,lockedHint:it.lockedHint||"",
        emptyPickHint:it.emptyPickHint||"",pickAllowEmpty:!!it.pickAllowEmpty,compositeKind:it.compositeKind||""
      });
      grid.appendChild(cardEl);
    }
    if(grid.children.length)root.appendChild(card);
  }
  const rest=Object.keys(map).filter(k=>!used.has(k));
  if(rest.length){
    const card=document.createElement("section");card.className="group-card";
    card.innerHTML=`<div class="group-card__head"><h3 class="group-card__title">Прочее</h3><p class="group-card__hint">Поля каталога вне основной раскладки.</p></div><div class="fields-grid"></div>`;
    const grid=card.querySelector(".fields-grid");
    for(const k of rest){const f=map[k];grid.appendChild(renderFieldCard(f,getValue(f),pathOf(f),v=>setValue(f,v),{span:12}))}
    root.appendChild(card);
  }
  return root;
}

const SCHEDULE_STATUS_RANK={

  "ПОДВЕДЕНИЕ ИТОГОВ":1,
  "ЗАВЕРШЕН":2,
  "ОТМЕНЕН":3,
  "УДАЛЕН":4,
};
function scheduleStatusRank(status){

  if(u==="ЗАВЕРШЕН") return "nav-btn--sch-done";
  if(u==="ОТМЕНЕН") return "nav-btn--sch-cancel";
  if(u==="УДАЛЕН") return "nav-btn--sch-deleted";
  return "";
}
/**
 * Тон строки конкурса в левом списке по статусам турниров в SCHEDULE.
 * Приоритет: АКТИВНЫЙ → ПОДВЕДЕНИЕ ИТОГОВ → ЗАВЕРШЕН → только ОТМЕНЕН/УДАЛЕН → нет турниров.
 */
function contestScheduleListTone(c){
  const rows=(c&&c.data&&c.data.schedule)||[];
  const statuses=rows
    .map(r=>String((r&&r.TOURNAMENT_STATUS)||"").trim().toUpperCase())
    .filter(Boolean);
  if(!statuses.length) return {cls:"contest-tab--sch-empty",label:"нет турниров в расписании"};
  if(statuses.some(s=>s==="АКТИВНЫЙ")) return {cls:"contest-tab--sch-active",label:"есть активный турнир"};
  if(statuses.some(s=>s==="ПОДВЕДЕНИЕ ИТОГОВ")) return {cls:"contest-tab--sch-results",label:"есть турнир на подведении итогов"};
  if(statuses.some(s=>s==="ЗАВЕРШЕН")) return {cls:"contest-tab--sch-done",label:"есть завершённый турнир"};
  const onlyDead=statuses.every(s=>s==="ОТМЕНЕН"||s==="УДАЛЕН");
  if(onlyDead) return {cls:"contest-tab--sch-cancel",label:"только отменённые / удалённые турниры"};
  return {cls:"contest-tab--sch-empty",label:"нет турниров в ключевых статусах"};
}
/** Сортировка периодов по TOURNAMENT_STATUS; сохраняет активный период. */
function sortScheduleRows(rows){
  if(!rows||rows.length<2) return;
  rows.sort((a,b)=>{
    const d=scheduleStatusRank(a.TOURNAMENT_STATUS)-scheduleStatusRank(b.TOURNAMENT_STATUS);
    if(d) return d;
    return String(a.TOURNAMENT_CODE||"").localeCompare(String(b.TOURNAMENT_CODE||""),"ru");
  });
}
function ensureScheduleSorted(){
  const rows=data().schedule;
  if(!rows||rows.length<2) return;
  const curRow=rows[activeSchedule];
  sortScheduleRows(rows);
  if(curRow){
    const ni=rows.indexOf(curRow);
    if(ni>=0){
      activeSchedule=ni;
      if(String(activeSection||"").startsWith("SCHEDULE:")) activeSection="SCHEDULE:"+(ni+1);
    }
  }
}

/** Скопировать поля строки по списку колонок (полная перезапись dst). */
function copyCols(src, dst, cols, skipKeys){

  for(const k of cols){
    if(skip.has(k)) continue;
    dst[k]=src[k]!=null?String(src[k]):"";

function applyGroupCopy(fromIdx, toIdxs){
  const rows=data().group||[];
  const src=rows[fromIdx];
  if(!src)return 0;
  let n=0;
  for(const j of toIdxs){
    if(j===fromIdx||j<0||j>=rows.length) continue;
    copyCols(src, rows[j], GROUP_COLS, ["CONTEST_CODE"]);
    rows[j].CONTEST_CODE=contestCodeOf();
    n++;
  }
  pruneLinkGroupCodes(data());
  return n;
}
function applyPairCopy(fromIdx, toIdxs){
  const badges=data().badges||[];
  const links=data().reward_link||[];
  const srcLink=links[fromIdx]||{};
  const srcBadge=badges[fromIdx]||{flat:{},add:{}};
  const srcRc=String(srcLink.REWARD_CODE||srcBadge.flat&&srcBadge.flat.REWARD_CODE||"").trim();
  const flatKeys=rewardFlatKeys();
  const addLeaves=rewardAddLeaves();
  let n=0;
  for(const j of toIdxs){
    if(j===fromIdx||j<0||j>=badges.length) continue;
    // REWARD_CODE специально не копируем — иначе дубли кодов наград в CSV
    const keepRc=String((links[j]&&links[j].REWARD_CODE)||"");
    copyCols(srcLink, links[j], LINK_COLS, ["CONTEST_CODE","REWARD_CODE"]);
    links[j].CONTEST_CODE=contestCodeOf();
    links[j].REWARD_CODE=keepRc;
    const flat={};
    for(const k of flatKeys){
      if(k==="REWARD_CODE"||k==="REWARD_TYPE") continue;
      flat[k]=srcBadge.flat&&srcBadge.flat[k]!=null?String(srcBadge.flat[k]):"";
    }
    flat.REWARD_CODE=keepRc;
    flat.REWARD_TYPE="BADGE";
    const add={};
    for(const leaf of addLeaves){
      let v=srcBadge.add&&srcBadge.add[leaf]!=null?String(srcBadge.add[leaf]):"";
      // если parent указывал на код источника — перекинуть на код цели
      if(leaf==="parentRewardCode"&&srcRc&&v===srcRc&&keepRc) v=keepRc;
      add[leaf]=v;
    }
    badges[j].flat=flat;
    badges[j].add=add;
    n++;
  }
  return n;
}

function contestCodeOf(d){return String((d||data()).contest.CONTEST_CODE||"").trim()}
/** База без хвостового _: r_CONTEST_CODE / t_CONTEST_CODE */
function rewardCodePrefix(cc){
  const c=String(cc||"").trim();
  return c?("r_"+c):"r_";
}
function tournamentCodePrefix(cc){
  const c=String(cc||"").trim();
  return c?("t_"+c):"t_";
}
function normalizeCodeSuffix(suffix){
  return String(suffix??"").replace(/^_+/,"");
}
/**
 * Полный код: base + (окончание ? "_" + окончание : "").
 * Пустое окончание → r_CODE / t_CODE без завершающего "_".
 */
function buildPrefixedCode(prefix, suffix){
  let base=String(prefix||"");
  if(base.endsWith("_")) base=base.slice(0,-1);
  const s=normalizeCodeSuffix(suffix);
  if(!base) return s;
  if(!s) return base;
  return base+"_"+s;
}
/** Вытащить окончание: снять r_/t_, снять CONTEST_CODE, остаток без ведущих _. */
function endingFromFullCode(full, contestCode, kind){
  let s=String(full||"").trim();
  const cc=String(contestCode||"").trim();
  if(kind==="reward"&&s.startsWith("r_")) s=s.slice(2);
  else if(kind==="tournament"&&s.startsWith("t_")) s=s.slice(2);
  if(cc&&s.startsWith(cc)) s=s.slice(cc.length);
  return normalizeCodeSuffix(s);
}
/** Значение из снимка: окончание или полный код → полный код fill/SPOD. */
function expandStoredPrefixedCode(raw, kind, contestCode){
  const cc=String(contestCode||"").trim();
  const prefix=kind==="reward"?rewardCodePrefix(cc):tournamentCodePrefix(cc);
  const s=String(raw||"").trim();
  // пустое окончание в снимке → полный код без суффикса (r_CODE / t_CODE)
  if(!s) return cc?buildPrefixedCode(prefix, ""):"";
  if(s.startsWith("r_")||s.startsWith("t_")){
    return buildPrefixedCode(prefix, endingFromFullCode(s, cc, kind));
  }
  // уже окончание
  return buildPrefixedCode(prefix, s);
}
function expandContestPrefixedCodes(d){
  const cc=contestCodeOf(d);
  for(const row of d.reward_link||[]){
    row.REWARD_CODE=expandStoredPrefixedCode(row.REWARD_CODE, "reward", cc);
  }
  for(const row of d.schedule||[]){
    row.TOURNAMENT_CODE=expandStoredPrefixedCode(row.TOURNAMENT_CODE, "tournament", cc);
  }
  const linkCodes=new Set(linkRewardCodes(d));
  for(const b of d.badges||[]){
    if(!b.flat) b.flat={};
    const rc=expandStoredPrefixedCode(b.flat.REWARD_CODE, "reward", cc);
    b.flat.REWARD_CODE=rc||(linkCodes.size===1?[...linkCodes][0]:rc);
    if(b.add&&b.add.parentRewardCode){
      const p=String(b.add.parentRewardCode||"").trim();
      if(p) b.add.parentRewardCode=expandStoredPrefixedCode(p, "reward", cc);
    }
  }
}
/** Отрезать базу префикса от полного кода → окончание ("" если хвоста нет). */
function suffixAfterPrefix(full, prefix){
  const s=String(full||"");
  let base=String(prefix||"");
  if(!s||!base) return null;
  if(base.endsWith("_")) base=base.slice(0,-1);
  if(s===base||s===base+"_") return "";
  if(s.startsWith(base+"_")) return normalizeCodeSuffix(s.slice(base.length+1));
  return null;
}
/** Вытащить окончание из полного кода (с учётом смены CONTEST_CODE). */
function extractCodeSuffix(full, prefix, prevPrefix){
  const s=String(full||"");
  if(!s) return "";
  let cut=suffixAfterPrefix(s, prefix);
  if(cut!==null) return cut;
  cut=suffixAfterPrefix(s, prevPrefix);
  if(cut!==null) return cut;
  // r_CODE / t_CODE без суффикса или r_CODE_suf
  if(s.startsWith("r_")||s.startsWith("t_")){
    const kind=s.startsWith("r_")?"reward":"tournament";
    const cc=contestCodeOf();
    return endingFromFullCode(s, cc, kind);
  }
  return normalizeCodeSuffix(s);
}
function resyncPrefixedCodes(d, prevCc){
  const cc=contestCodeOf(d);
  const rPrev=rewardCodePrefix(prevCc);
  const rNow=rewardCodePrefix(cc);
  const tPrev=tournamentCodePrefix(prevCc);
  const tNow=tournamentCodePrefix(cc);
  for(const row of d.reward_link||[]){
    let s=extractCodeSuffix(row.REWARD_CODE, rNow, rPrev);
    const full=String(row.REWARD_CODE||"");
    if(prevCc && full.startsWith(prevCc) && !full.startsWith("r_")) s=normalizeCodeSuffix(full.slice(prevCc.length));
    else if(full.startsWith("r_")){
      const rest=full.slice(2);
      if(prevCc && rest.startsWith(prevCc)) s=normalizeCodeSuffix(rest.slice(prevCc.length));
      else if(cc && rest.startsWith(cc)) s=normalizeCodeSuffix(rest.slice(cc.length));
    }
    row.REWARD_CODE=buildPrefixedCode(rNow, s);
  }
  for(const row of d.schedule||[]){
    let s=extractCodeSuffix(row.TOURNAMENT_CODE, tNow, tPrev);
    const full=String(row.TOURNAMENT_CODE||"");
    if(prevCc && full.startsWith(prevCc) && !full.startsWith("t_")) s=normalizeCodeSuffix(full.slice(prevCc.length));
    else if(full.startsWith("t_")){
      const rest=full.slice(2);
      if(prevCc && rest.startsWith(prevCc)) s=normalizeCodeSuffix(rest.slice(prevCc.length));
      else if(cc && rest.startsWith(cc)) s=normalizeCodeSuffix(rest.slice(cc.length));
    }
    row.TOURNAMENT_CODE=buildPrefixedCode(tNow, s);
  }
  const allowed=new Set(linkRewardCodes(d));
  for(const b of d.badges||[]){
    const rc=String((b.flat&&b.flat.REWARD_CODE)||"").trim();
    if(rc && !allowed.has(rc)){
      let s=extractCodeSuffix(rc, rNow, rPrev);
      if(prevCc && rc.startsWith(prevCc) && !rc.startsWith("r_")) s=normalizeCodeSuffix(rc.slice(prevCc.length));
      else if(rc.startsWith("r_")){
        const rest=rc.slice(2);
        if(prevCc && rest.startsWith(prevCc)) s=normalizeCodeSuffix(rest.slice(prevCc.length));
        else if(cc && rest.startsWith(cc)) s=normalizeCodeSuffix(rest.slice(cc.length));
      }
      const next=buildPrefixedCode(rNow, s);
      b.flat.REWARD_CODE=allowed.has(next)?next:(allowed.size===1?[...allowed][0]:"");
    }
  }
}
function linkRewardCodes(d){
  d=d||data();
  const seen=new Set();const out=[];
  for(const row of d.reward_link||[]){
    const rc=String(row.REWARD_CODE||"").trim();
    if(!rc||seen.has(rc))continue;
    seen.add(rc);out.push(rc);
  }
  return out;
}
function groupCodesOf(d){
  d=d||data();
  const seen=new Set();const out=[];
  for(const row of d.group||[]){
    const gc=String(row.GROUP_CODE||"").trim();
    if(!gc||seen.has(gc))continue;
    seen.add(gc);out.push(gc);
  }
  return out;
}
function emptyLinkRow(){
  const row=Object.fromEntries(LINK_COLS.map(c=>[c,""]));
  row.CONTEST_CODE=contestCodeOf();
  for(const f of (catalog.sections.find(s=>s.id==="TABLE:REWARD-LINK")||{fields:[]}).fields){
    if(f.key==="CONTEST_CODE"||f.key==="REWARD_CODE") continue;
    if(f.default!=null&&String(f.default)!==""&&!row[f.key]) row[f.key]=String(f.default);
  }

}
function pruneLinkGroupCodes(d){
  const allowed=new Set(groupCodesOf(d));

}

}

function seedLinked(data){
  const code=String(data.contest.CONTEST_CODE||"").trim();

  for(const row of data.indicator)row.CONTEST_CODE=code;

function syncBadgeSlots(data,force){
  const max=maxBadges(data.contest.CONTEST_TYPE);
  if(force){
    const next=[];for(let i=0;i<max;i++)next.push(data.badges[i]?clone(data.badges[i]):emptyBadge());
    data.badges=next;if(activeBadge>=max)activeBadge=0;if(activeLink>=max)activeLink=0;
  }else if(data.badges.length>max){
    data.badges=data.badges.slice(0,max);if(activeBadge>=max)activeBadge=0;if(activeLink>=max)activeLink=0;
  }else if(!data.badges.length){
    data.badges=[emptyBadge()];
  }
  const n=data.badges.length;
  const cc=String(data.contest.CONTEST_CODE||"").trim();
  const links=[];
  for(let i=0;i<n;i++){
    const prev=(data.reward_link&&data.reward_link[i])?Object.assign({},data.reward_link[i]):Object.fromEntries(LINK_COLS.map(c=>[c,""]));
    prev.CONTEST_CODE=cc;
    links.push(prev);
  }
  data.reward_link=links;
  data.badges.forEach((b,i)=>{
    if(!b.flat.REWARD_TYPE)b.flat.REWARD_TYPE="BADGE";
    b.flat.REWARD_CODE=String((data.reward_link[i]||{}).REWARD_CODE||"");
  });
  if(activeLink>=n) activeLink=Math.max(0,n-1);
  activeBadge=activeLink;
  seedLinked(data);
}

function listFromCell(raw){return String(raw||"").split(";").map(x=>x.trim()).filter(x=>x!=="")}
function selectionRequired(f){const kind=f.kind||"text";return !f.allow_empty&&(kind==="dropdown"||kind==="dropdown_custom"||kind==="list")}

/** Свободный массив через ; (list без заранее заданных variants). */
function mountListFreeform(host, f, value, onChange){
  const required=selectionRequired(f);
  const wrap=document.createElement("div");
  wrap.className="list-freeform";
  wrap.setAttribute("data-tip",tipFor(f)+"\nМассив: элементы через ;");
  const ta=document.createElement("textarea");
  ta.value=value||"";
  ta.placeholder="значения через ; …";
  ta.rows=3;
  ta.addEventListener("input",()=>onChange(ta.value));
  ta.addEventListener("change",()=>{
    let next=ta.value.trim();
    if(required&&!next){toast("«Можно пусто» = нет — укажите значение");ta.value=value||"";return}
    // нормализуем пробелы вокруг ;
    next=listFromCell(next).join(";");
    ta.value=next;
    onChange(next);
  });
  ta.addEventListener("focus",()=>host.closest(".field")?.classList.add("is-focus"));
  ta.addEventListener("blur",()=>host.closest(".field")?.classList.remove("is-focus"));
  wrap.appendChild(ta);
  host.appendChild(wrap);
}

function mountChips(host, f, value, onChange, {multi}){
  const box=document.createElement("div");box.className="default-checks"+(multi?"":" default-checks--single");
  const variants=f.variants||[];
  const required=selectionRequired(f);
  let curVal=value||"";
  if(required&&variants.length){
    if(multi){if(!listFromCell(curVal).filter(x=>variants.includes(x)).length){curVal=variants[0];onChange(curVal)}}
    else if(!String(curVal).trim()||!variants.includes(String(curVal))){curVal=variants[0];onChange(curVal)}
  }
  box.setAttribute("data-tip",tipFor(f)+(required?"\nОбязательно: нельзя снять все варианты":"\nМожно пусто: повторный клик снимает выбор"));
  const extra=multi?document.createElement("input"):null;
  if(extra){extra.type="text";extra.placeholder="дополнительно через ;";extra.value=curVal;extra.style.marginTop="6px";extra.addEventListener("change",()=>{
    let next=extra.value;
    if(required){const parts=listFromCell(next);if(!parts.length){toast("«Можно пусто» = нет — оставьте значение");extra.value=curVal;return}}
    curVal=next;onChange(curVal);paint()
  })}
  function selected(){return multi?listFromCell(curVal):[String(curVal||"")].filter(Boolean)}
  function paint(){
    const sel=new Set(selected());
    box.innerHTML="";
    variants.forEach(v=>{
      const btn=document.createElement("button");btn.type="button";btn.className="default-chip"+(sel.has(v)?" is-on":"");
      const lab=labelForVariant(f,v);
      btn.setAttribute("data-tip", lab?`${lab} → в файл: ${v}`:`В файл: ${v}`);
      btn.innerHTML=`<span class="default-chip__mark">${markSvg()}</span>${chipFaceHtml(v,lab)}`;
      btn.addEventListener("click",()=>{
        if(multi){
          let cur=listFromCell(curVal);
          if(cur.includes(v)){
            if(required&&cur.length<=1){toast("«Можно пусто» = нет — оставьте хотя бы один");return}
            cur=cur.filter(x=>x!==v);
          }else cur.push(v);
          curVal=cur.join(";");if(extra)extra.value=curVal;onChange(curVal);paint();refreshContestTabDirty();
        }else{
          if(curVal===v){
            if(required){toast("«Можно пусто» = нет — значение должно быть выбрано");return}
            curVal="";
          }else curVal=v;
          onChange(curVal);paint();afterFieldKey(f.key);
          // Полный render только когда меняется структура (тип → число наград)
          if(f.key==="CONTEST_TYPE") render();
          else refreshContestTabDirty();
        }
      });
      box.appendChild(btn);
    });
  }
  host.appendChild(box);if(extra)host.appendChild(extra);paint();
}

/** Dropdown с полем «свой вариант»: в сохранение идёт выбранный чип или текст своего ввода. */
function mountDropdownCustom(host, f, value, onChange){
  const variants=f.variants||[];
  const required=selectionRequired(f);
  let curVal=String(value||"");
  if(required&&!String(curVal).trim()&&variants.length){curVal=variants[0];onChange(curVal)}
  const wrap=document.createElement("div");
  wrap.setAttribute("data-tip",tipFor(f)+(required?"\nОбязательно: чип или свой текст — пусто нельзя":"\nМожно пусто: можно снять чип и очистить свой вариант"));
  const box=document.createElement("div");box.className="default-checks default-checks--single";
  const custom=document.createElement("div");custom.className="custom-variant";
  custom.innerHTML=`<div class="custom-variant__label">Свой вариант</div>`;
  const input=document.createElement("input");input.type="text";input.placeholder="Введите своё значение…";
  input.setAttribute("data-tip","Если заполнено — в CSV/JSON попадёт этот текст");
  custom.appendChild(input);

  function isCustom(v){return !!String(v||"").trim()&&!variants.includes(String(v))}
  function paintChips(){
    const sel=new Set(variants.includes(curVal)?[curVal]:[]);
    box.innerHTML="";
    variants.forEach(v=>{
      const btn=document.createElement("button");btn.type="button";btn.className="default-chip"+(sel.has(v)?" is-on":"");
      const lab=labelForVariant(f,v);
      btn.setAttribute("data-tip", lab?`${lab} → в файл: ${v}`:`В файл: ${v}`);
      btn.innerHTML=`<span class="default-chip__mark">${markSvg()}</span>${chipFaceHtml(v,lab)}`;
      btn.addEventListener("click",()=>{
        if(curVal===v){
          if(required){toast("«Можно пусто» = нет — оставьте чип или введите свой вариант");return}
          curVal="";
          input.value="";
        }else{
          curVal=v;
          input.value="";
        }
        onChange(curVal);
        paintChips();
        custom.classList.toggle("is-on",isCustom(curVal));
        afterFieldKey(f.key);
      });
      box.appendChild(btn);
    });
    custom.classList.toggle("is-on",isCustom(curVal));
  }
  if(isCustom(curVal))input.value=curVal;
  else if(variants.includes(curVal))input.value="";
  else input.value=curVal;
  input.addEventListener("input",()=>{
    curVal=input.value;
    onChange(curVal);
    paintChips();
  });
  input.addEventListener("change",()=>{
    curVal=input.value.trim();
    if(required&&!curVal){
      curVal=variants[0]||"";
      input.value="";
      toast("«Можно пусто» = нет — выбран первый вариант из списка");
    }else{
      input.value=isCustom(curVal)?curVal:"";
    }
    onChange(curVal);
    paintChips();
  });
  input.addEventListener("blur",()=>{
    if(required&&!String(curVal).trim()){
      curVal=variants[0]||"";
      input.value="";
      onChange(curVal);
      paintChips();
    }
    host.closest(".field")?.classList.remove("is-focus");
  });
  input.addEventListener("focus",()=>host.closest(".field")?.classList.add("is-focus"));
  wrap.appendChild(box);wrap.appendChild(custom);host.appendChild(wrap);paintChips();
}

function isEditedValue(path, val){
  const b=baseline();
  const parts=path.split(".");
  let cur=b;for(const p of parts){if(cur==null){cur=undefined;break}if(/^\d+$/.test(p))cur=cur[Number(p)];else cur=cur[p]}
  return String(cur??"")!==String(val??"");
}

function jsonStoreLeaf(f, sectionPrefix, legacyPrefix){
  const jt=String(f.json_target||"").trim();
  if(sectionPrefix&&jt.startsWith(sectionPrefix+"."))return jt.slice(sectionPrefix.length+1);
  const key=String(f.key||"");
  if(sectionPrefix&&key.startsWith(sectionPrefix+"."))return key.slice(sectionPrefix.length+1);
  if(legacyPrefix&&key.startsWith(legacyPrefix+"."))return key.slice(legacyPrefix.length+1);
  if(key.includes("."))return key.split(".").slice(1).join(".");
  return key;
}
function jsonPackLeaf(f, prefix){
  const jt=String(f.json_target||"").trim();
  if(prefix&&jt.startsWith(prefix+"."))return jt.slice(prefix.length+1);
  if(jt&&!jt.includes("."))return jt;
  return jsonStoreLeaf(f, prefix, prefix==="CONTEST_FEATURE"?"FEATURE":prefix==="REWARD_ADD_DATA"?"ADD":"");
}

function mountCompositeCode(host, f, fullValue, onChange, tip, prefix){
  const cc=contestCodeOf();
  const miss=!cc;
  const wrap=document.createElement("div");
  wrap.className="code-composite-wrap";
  const box=document.createElement("div");
  box.className="code-composite";
  box.setAttribute("data-tip",tip+(miss?"\nСначала задайте CONTEST_CODE на шаге «Конкурс»":"\nТолько окончание; пусто → код без «_» в конце (r_/t_ + CONTEST_CODE)"));
  const pre=document.createElement("span");
  pre.className="code-composite__prefix"+(miss?" is-miss":"");
  pre.setAttribute("data-tip",miss?"Нужен код конкурса":"База: r_/t_ + CONTEST_CODE. Символ «_» перед окончанием — только если окончание заполнено");
  const inp=document.createElement("input");
  inp.type="text";
  inp.placeholder="пусто = без окончания";
  inp.disabled=miss;
  let suf="";
  const full=String(fullValue||"");
  const cut=suffixAfterPrefix(full, prefix);
  if(cut!==null) suf=cut;
  else if(full.startsWith("r_")||full.startsWith("t_")){
    const rest=full.slice(2);
    if(cc && rest.startsWith(cc)) suf=normalizeCodeSuffix(rest.slice(cc.length));
  }else if(cc && full.startsWith(cc)) suf=normalizeCodeSuffix(full.slice(cc.length));
  else if(full && !full.startsWith("r_") && !full.startsWith("t_")) suf=normalizeCodeSuffix(full);
  inp.value=suf;
  const fullEl=document.createElement("div");
  fullEl.className="code-composite__full";
  function paintPrefix(){
    if(miss){pre.textContent=String(prefix||"").slice(0,2)+"…";return}
    const s=normalizeCodeSuffix(inp.value);
    // «_» в превью только когда есть окончание
    pre.textContent=s?(prefix+"_"):prefix;
  }
  function paintFull(){
    paintPrefix();
    const built=miss?"":buildPrefixedCode(prefix, inp.value);
    fullEl.textContent=built?("полный код: "+built):(miss?"сначала CONTEST_CODE":"полный код: "+prefix);
  }
  const emit=()=>{onChange(miss?"":buildPrefixedCode(prefix, inp.value));paintFull()};
  inp.addEventListener("input",emit);
  inp.addEventListener("focus",()=>host.closest(".field")?.classList.add("is-focus"));
  inp.addEventListener("blur",()=>{host.closest(".field")?.classList.remove("is-focus");emit()});
  box.appendChild(pre);box.appendChild(inp);
  wrap.appendChild(box);wrap.appendChild(fullEl);
  host.appendChild(wrap);
  paintFull();
  // нормализовать пустое окончание → r_CODE / t_CODE (без хвостового _)
  if(!miss){
    const built=buildPrefixedCode(prefix, inp.value);
    if(built && built!==full) onChange(built);
  }
}

function renderFieldCard(f, value, path, onChange, opts){
  opts=opts||{};
  const kind=f.kind||"text";
  const tip=tipFor(f,opts);
  const dirty=isEditedValue(path,value);
  const jsonFact=String(f.json_target||"").trim();
  const card=document.createElement("div");
  const span=opts.span||12;
  const locked=!!opts.locked;
  const pick=Array.isArray(opts.pickVariants)?opts.pickVariants:null;
  const allow=fieldAllowEmpty(f,opts);
  const compositeKind=opts.compositeKind||"";
  card.className="field span-"+span+(opts.hero?" field--hero":"")+(dirty?" is-edited":"")+(locked?" is-locked":"")+(pick?" field--pick":"")+(allow?"":" is-required");
  const showKey=jsonFact||String(f.key||"");const showJson=jsonFact&&jsonFact!==String(f.key||"");card.innerHTML=`<div class="field-head"><span class="field-label">${esc(f.label||f.key)}</span><span class="edited-badge">изменено</span>${emptyPillHtml(f,opts)}<span class="field-key" data-tip="Ключ параметра / путь в JSON">${esc(showKey)}</span>${showJson?`<span class="json-fact" data-tip="Полный путь в JSON SPOD: ${esc(jsonFact)}">${esc(jsonFact)}</span>`:""}<span class="kind-pill ${esc(kind)}" data-tip="${esc(kindLabel(kind))}">${esc(kindShort(kind))}</span></div>${f.description?`<div class="field-desc">${esc(f.description)}</div>`:""}<div class="field-control"></div>`;
  const host=card.querySelector(".field-control");
  const wrapChange=v=>{onChange(v);card.classList.toggle("is-edited",isEditedValue(path,v));refreshContestTabDirty()};
  if(locked&&!pick){
    const box=document.createElement("div");box.className="locked-value";
    box.innerHTML=`<span>${esc(value||"—")}</span>${opts.lockedHint?`<span class="locked-value__hint">${esc(opts.lockedHint)}</span>`:""}`;
    box.setAttribute("data-tip",(opts.lockedHint||"Поле задаётся автоматически")+"\n"+tip);
    host.appendChild(box);
    return card;
  }
  if(pick){
    if(!pick.length){
      const box=document.createElement("div");box.className="locked-value";
      box.innerHTML=`<span>${esc(value||"—")}</span><span class="locked-value__hint">${esc(opts.emptyPickHint||opts.lockedHint||"Нет вариантов для выбора")}</span>`;
      host.appendChild(box);
    }else{
      const fPick=Object.assign({},f,{kind:"dropdown",variants:pick,allow_empty:!!opts.pickAllowEmpty});
      mountChips(host,fPick,value,wrapChange,{multi:false});
    }
    return card;
  }
  if(compositeKind==="reward"||compositeKind==="tournament"){
    const prefix=compositeKind==="reward"?rewardCodePrefix(contestCodeOf()):tournamentCodePrefix(contestCodeOf());
    mountCompositeCode(host,f,value,wrapChange,tip,prefix);
    return card;
  }
  if(kind==="dropdown_custom") mountDropdownCustom(host,f,value,wrapChange);
  else if(kind==="dropdown"&&(f.variants||[]).length) mountChips(host,f,value,wrapChange,{multi:false});
  else if(kind==="list"){
    if((f.variants||[]).length) mountChips(host,f,value,(v)=>wrapChange(v),{multi:true});
    else mountListFreeform(host,f,value,wrapChange);

  else if(kind==="number"){

    if(f.key==="REWARD_COST"){inp.min="0"}
    inp.value=value!==undefined&&value!==null&&String(value)!==""?String(value):"";
    inp.placeholder="число";
    inp.setAttribute("data-tip",tip);
    inp.addEventListener("input",()=>wrapChange(inp.value));

      if(raw===""){if(!fieldAllowEmpty(f,opts)){inp.value=f.default!=null?String(f.default):"0";wrapChange(inp.value)}else wrapChange("");return}
      const n=Number(raw);

      inp.value=next;wrapChange(next);
    });
    host.appendChild(inp);
  }
  else if(kind==="json"){const ta=document.createElement("textarea");ta.value=value||"";ta.rows=4;ta.placeholder="{ … } или [ … ]";ta.setAttribute("data-tip",tip);ta.addEventListener("input",()=>wrapChange(ta.value));ta.addEventListener("focus",()=>card.classList.add("is-focus"));ta.addEventListener("blur",()=>card.classList.remove("is-focus"));host.appendChild(ta)}
  else if(f.key==="CONTEST_PERIOD"||f.key==="CONTEST_DESCRIPTION"||f.key==="REWARD_DESCRIPTION"||f.key==="REWARD_CONDITION"||String(f.key).endsWith("News")||f.key==="ADD.rewardRule"||f.key==="REWARD_ADD_DATA.rewardRule"||f.key==="ADD.winCriterion"||f.key==="REWARD_ADD_DATA.winCriterion"){
    const ta=document.createElement("textarea");ta.value=value||"";ta.rows=f.key==="CONTEST_PERIOD"?3:4;ta.setAttribute("data-tip",tip);ta.addEventListener("input",()=>wrapChange(ta.value));ta.addEventListener("focus",()=>card.classList.add("is-focus"));ta.addEventListener("blur",()=>card.classList.remove("is-focus"));host.appendChild(ta);

  return card;
}

function afterFieldKey(key, prevContestCode){
  const d=data();
  if(key==="CONTEST_TYPE"){syncBadgeSlots(d,true);seedLinked(d)}
  if(key==="CONTEST_CODE"){
    resyncPrefixedCodes(d, prevContestCode==null?"":prevContestCode);
    seedLinked(d);
  }
}

function contestTitle(c,i){
  const code=c.data.contest.CONTEST_CODE||"";
  const name=c.data.contest.FULL_NAME||"";
  if(code||name)return (code||"без кода")+(name?" · "+name:"");
  return "Конкурс "+(i+1);
}
function contestCodeLine(c,i){
  const code=String((c.data.contest&&c.data.contest.CONTEST_CODE)||"").trim();
  if(code) return code;
  return "Конкурс "+((i||0)+1);
}
function contestNameLine(c){
  return String((c.data.contest&&c.data.contest.FULL_NAME)||"").trim();
}
/** Подсказка вкладки: FULL_NAME без кода; если названия нет — код. */
function contestMenuTip(c,i){
  const name=contestNameLine(c);
  if(name) return name;
  const code=String((c.data.contest&&c.data.contest.CONTEST_CODE)||"").trim();
  if(code) return code;
  return "Конкурс "+((i||0)+1);
}
/** Награды = индивидуальные; Турниры = ТУРНИРНЫЙ (и прочие). */
function contestMenuKind(c){
  const t=String((c.data.contest&&c.data.contest.CONTEST_TYPE)||"").trim().toUpperCase();
  if(t==="ИНДИВИДУАЛЬНЫЙ"||t==="ИНДИВИДУАЛЬНЫЙ НАКОПИТЕЛЬНЫЙ") return "reward";
  return "tournament";
}

/** Обновить заголовок вкладки конкурса без полной перерисовки workspace (иначе текстовые поля теряют фокус). */
function refreshActiveContestTabTitle(){
  const tab=$("contest-tabs")&&$("contest-tabs").querySelector(".contest-tab.active .ct-text");
  if(!tab)return;
  const c=cur();
  const codeEl=tab.querySelector(".ct-code");
  const nameEl=tab.querySelector(".ct-fullname");
  if(codeEl) codeEl.textContent=contestCodeLine(c,activeContest);
  if(nameEl) nameEl.textContent=contestNameLine(c);
  tab.setAttribute("data-tip",contestMenuTip(c,activeContest));
}

function contestSearchHaystack(c){
  const d=c&&c.data?c.data:{};
  const parts=[];
  const ct=d.contest||{};
  parts.push(ct.CONTEST_CODE,ct.FULL_NAME,ct.CONTEST_DESCRIPTION);
  for(const b of d.badges||[]){
    const flat=b&&b.flat?b.flat:{};
    parts.push(flat.FULL_NAME,flat.REWARD_DESCRIPTION);
  }
  return parts.map(x=>String(x??"")).join("\n").toLowerCase();
}
function contestMatchesListQuery(c,q){
  const needle=String(q||"").trim().toLowerCase();
  if(!needle) return true;
  return contestSearchHaystack(c).includes(needle);
}
function contestMatchesKindFilter(c){
  const kind=contestMenuKind(c);
  if(kind==="reward") return !!contestListShowReward;
  return !!contestListShowTournament;
}
function syncContestKindFilterButtons(){
  const t=$("filter-tournaments");
  const r=$("filter-rewards");
  if(t){
    t.classList.toggle("is-on",contestListShowTournament);
    t.setAttribute("aria-pressed",contestListShowTournament?"true":"false");
  }
  if(r){
    r.classList.toggle("is-on",contestListShowReward);
    r.setAttribute("aria-pressed",contestListShowReward?"true":"false");
  }
}

function renderContestTabs(){
  const host=$("contest-tabs");
  if(!host)return;
  syncContestKindFilterButtons();
  const rewards=[];
  const tournaments=[];
  contests.forEach((c,i)=>{
    if(!contestMatchesKindFilter(c)) return;
    if(!contestMatchesListQuery(c,contestListQuery)) return;
    if(contestMenuKind(c)==="reward") rewards.push({c,i});
    else tournaments.push({c,i});
  });
  function groupHtml(kind, title, items){
    if(!items.length) return "";
    return `<div class="contest-tabs-group contest-tabs-group--${kind}">`+
      `<div class="contest-tabs-group__title">${esc(title)}${items.length?` · ${items.length}`:""}</div>`+
      items.map(({c,i})=>{
        const dirty=isContestDirty(c);
        const tone=contestScheduleListTone(c);
        const tip=contestMenuTip(c,i)+(dirty?" · есть несохранённые правки":"")+(tone.label?" · "+tone.label:"");
        const tabTip=dirty?"Есть правки параметров":(tone.label||"Текущий конкурс");
        return `<div class="contest-tab ${tone.cls}${i===activeContest?" active":""}${dirty?" is-dirty":""}" data-ci="${i}" data-tip="${esc(tabTip)}"><span class="ct-text" data-tip="${esc(tip)}"><span class="ct-code">${esc(contestCodeLine(c,i))}</span><span class="ct-fullname">${esc(contestNameLine(c))}</span></span>${contests.length>1?`<button type="button" class="ct-x" data-del="${i}" data-tip="Удалить конкурс">×</button>`:""}</div>`;
      }).join("")+
      `</div>`;
  }
  // Награды сверху, турниры снизу — пустые группы не показываем
  host.innerHTML=groupHtml("reward","Награды",rewards)+groupHtml("tournament","Турниры",tournaments);
  if(!host.innerHTML.trim()){
    const q=String(contestListQuery||"").trim();
    if(!contestListShowTournament&&!contestListShowReward){
      host.innerHTML=`<div class="contest-tabs-empty">Включите «Турниры» или «Награды»</div>`;
    }else if(q){
      host.innerHTML=`<div class="contest-tabs-empty">Нет конкурсов по запросу «${esc(q)}»</div>`;
    }else{
      host.innerHTML=`<div class="contest-tabs-empty">Нет конкурсов выбранного типа</div>`;
    }
  }
  host.querySelectorAll("[data-ci]").forEach(el=>{
    el.addEventListener("click",e=>{
      if(e.target.closest("[data-del]"))return;
      activeContest=Number(el.getAttribute("data-ci"));
      activeSection="CONTEST";activeBadge=0;activeSchedule=0;activeIndicator=0;activeGroup=0;activeLink=0;
      closeAllDatePops();
      const c=cur();
      seedLinked(c.data);
      ensureScheduleSorted();
      realignBaselineIfPristine(c);
      render();
    });
  });
  host.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click",e=>{e.stopPropagation();const i=Number(btn.getAttribute("data-del"));if(!confirm("Удалить конкурс?"))return;contests.splice(i,1);if(activeContest>=contests.length)activeContest=contests.length-1;persistLocal();render()});
  });
}

function navItems(){
  const n=data().badges.length;
  const max=maxBadges(data().contest.CONTEST_TYPE);
  const groupRows=data().group||[];
  const indRows=data().indicator||[];

  // Строка 1: Конкурс → Индикаторы → Группы
  const rowMain=[];
  rowMain.push({kind:"group",group:"contest",title:"Конкурс",meta:"карточка + FEATURE"});
  {
    const title=contestTypeNavLabel(data().contest.CONTEST_TYPE);
    const sub=contestCardSub();
    rowMain.push({
      id:"CONTEST",
      title,
      sub,
      tag:"start",
      tagLabel:"DATA",
      slot:true,
      nameSlot:true,
      tip:sub?title+" · "+sub:title,
    });
  }
  rowMain.push({id:"CONTEST_FEATURE",title:"Особенности",sub:"CONTEST_FEATURE",tag:"json",tagLabel:"JSON",slot:true,child:true});

  rowMain.push({kind:"group",group:"ind",title:"Индикаторы",meta:indRows.length+" шт."});
  if(!indRows.length){
    rowMain.push({id:"INDICATOR:1",title:"Индикатор 1",sub:"INDICATOR_CODE",tag:"table",tagLabel:"I1",slot:true});
  }else{
    indRows.forEach((r,i)=>{
      const title=indicatorTitle(r,i);
      const sub=indicatorSub(r);
      rowMain.push({
        id:"INDICATOR:"+(i+1),
        title,
        sub,
        tag:"table",
        tagLabel:"I"+(i+1),
        slot:true,
        tip:sub?title+" · "+sub:title,
      });
    });
  }

  rowMain.push({kind:"group",group:"groups",title:"Группы",meta:groupRows.length+" шт."});
  if(!groupRows.length){
    rowMain.push({id:"GROUP:1",title:"Группа 1",sub:"GROUP_CODE",tag:"table",tagLabel:"G1",slot:true});
  }else{
    groupRows.forEach((r,i)=>{
      const title=groupTitle(r,i);
      const sub=groupSub(r);
      rowMain.push({
        id:"GROUP:"+(i+1),
        title,
        sub,
        tag:"table",
        tagLabel:"G"+(i+1),
        slot:true,
        tip:sub?title+" · "+sub:title,
      });
    });
  }

  // Строка 2: Связи + награды (+ особенности JSON)
  const rowLinks=[];
  rowLinks.push({kind:"group",group:"pair",title:"Связи + награды",meta:n+" / макс. "+max});
  for(let i=0;i<Math.max(n,1);i++){
    const label=pairNavTitle(i);
    const code=badgeRewardCode(i)||"";
    rowLinks.push({
      kind:"pairUnit",
      index:i,
      pairId:"PAIR:"+(i+1),
      addId:"ADD:"+(i+1),
      pairTitle:label,
      pairSub:"связь + BADGE",
      addTitle:"Особенности",
      addSub:code?("JSON · "+code):"REWARD_ADD_DATA",
      tipPair:label,
      tipAdd:"JSON REWARD_ADD_DATA для награды "+(code||("#"+(i+1))),
    });
  }

  // Строка 3: Расписание (всегда последняя) — порядок по TOURNAMENT_STATUS
  ensureScheduleSorted();
  const schSorted=data().schedule||[];
  const rowSchedule=[];
  rowSchedule.push({kind:"group",group:"sch",title:"Расписание",meta:schSorted.length+" тур."});
  if(!schSorted.length){
    rowSchedule.push({id:"SCHEDULE:1",title:"Период 1",sub:"TOURNAMENT_CODE",tag:"table",tagLabel:"T1",slot:true,codeSlot:true});
  }else{
    schSorted.forEach((r,i)=>{
      const title=scheduleTitle(r,i);
      const sub=scheduleSub(r);
      rowSchedule.push({
        id:"SCHEDULE:"+(i+1),
        title,
        sub,
        tag:"table",
        tagLabel:"T"+(i+1),
        slot:true,
        codeSlot:true,
        statusClass:scheduleStatusNavClass(r.TOURNAMENT_STATUS),
        tip:sub?title+" · "+sub:title,
      });
    });
  }

  return {rowMain,rowLinks,rowSchedule};
}

function badgeRewardCode(i){
  const b=(data().badges||[])[i];
  return String((b&&b.flat&&b.flat.REWARD_CODE)||"").trim();
}
function badgeNavTitle(i){
  const code=badgeRewardCode(i);
  return code||("Награда "+(i+1));
}
function linkNavTitle(i){
  const row=((data().reward_link)||[])[i]||{};
  const rc=String(row.REWARD_CODE||"").trim();
  const gc=String(row.GROUP_CODE||"").trim();
  if(rc) return rc+(gc?" · "+gc:"");
  if(gc) return "Связь · "+gc;
  return "Связь "+(i+1);
}
function pairNavTitle(i){
  return badgeRewardCode(i)||linkNavTitle(i)||("Пара "+(i+1));
}
function clampIndex(i,len){
  if(!len) return 0;
  if(!Number.isFinite(i)||i<0) return 0;
  if(i>=len) return len-1;
  return i;
}
function normalizeActiveSection(){
  if(activeSection==="REWARD-LINK"||activeSection==="BADGE"||activeSection==="LINK"){
    activeSection="PAIR:"+(activeLink+1);
  }
  if(activeSection==="GROUP") activeSection="GROUP:"+(activeGroup+1);
  if(activeSection==="INDICATOR") activeSection="INDICATOR:"+(activeIndicator+1);
  if(activeSection==="SCHEDULE") activeSection="SCHEDULE:"+(activeSchedule+1);
  if(activeSection.startsWith("ADD:")){
    const n=(data().badges||[]).length||1;
    let i=Number(activeSection.split(":")[1])-1;
    i=clampIndex(i,n);
    activeLink=i;activeBadge=i;
    activeSection="ADD:"+(i+1);
    return;
  }
  if(activeSection.startsWith("BADGE:")||activeSection.startsWith("LINK:")||activeSection.startsWith("PAIR:")){
    const n=(data().badges||[]).length||1;
    let i=Number(activeSection.split(":")[1])-1;
    i=clampIndex(i,n);
    activeLink=i;activeBadge=i;
    activeSection="PAIR:"+(i+1);
  }
  if(activeSection.startsWith("GROUP:")){
    const n=Math.max((data().group||[]).length,1);
    let i=Number(activeSection.split(":")[1])-1;
    i=clampIndex(i,n);
    activeGroup=i;
    activeSection="GROUP:"+(i+1);
  }
  if(activeSection.startsWith("INDICATOR:")){
    const n=Math.max((data().indicator||[]).length,1);
    let i=Number(activeSection.split(":")[1])-1;
    i=clampIndex(i,n);
    activeIndicator=i;
    activeSection="INDICATOR:"+(i+1);
  }
  if(activeSection.startsWith("SCHEDULE:")){
    const n=Math.max((data().schedule||[]).length,1);
    let i=Number(activeSection.split(":")[1])-1;
    i=clampIndex(i,n);
    activeSchedule=i;
    activeSection="SCHEDULE:"+(i+1);
  }
}

function navBtnHtml(it){
  const child=it.child?" nav-btn--child":"";
  const slot=(it.slot||it.child)?" nav-btn--slot":"";
  const json=it.tag==="json"?" nav-btn--json":"";
  const code=it.codeSlot?" nav-btn--code":"";
  const name=it.nameSlot?" nav-btn--name":"";
  const status=it.statusClass?(" "+it.statusClass):"";
  return `<button type="button" class="nav-btn${slot}${child}${json}${code}${name}${status}${activeSection===it.id?" active":""}" data-nav="${esc(it.id)}" data-tip="${esc(it.tip||it.title)}"><span class="nav-btn__body"><span class="nav-btn__title">${esc(it.title)}</span><span class="nav-sub">${esc(it.sub||"")}</span></span><span class="tag ${it.tag}">${esc(it.tagLabel)}</span></button>`;
}

function renderNavRow(raw){
  let html="";
  let i=0;
  while(i<raw.length){
    const it=raw[i];
    if(it.kind==="group"){
      const cluster=it.group;
      html+=`<div class="nav-group nav-group--${esc(cluster)}" role="group" aria-label="${esc(it.title)}">`;
      html+=`<div class="nav-group__title"><span>${esc(it.title)}</span><span class="nav-group__meta">${esc(it.meta||"")}</span></div>`;
      let j=i+1;
      while(j<raw.length && (raw[j].slot||raw[j].kind==="pairUnit")){
        const s=raw[j];
        if(s.kind==="pairUnit"){
          const pairOn=activeSection===s.pairId;
          const addOn=activeSection===s.addId;
          const unitCls=addOn?" is-on-add":(pairOn?" is-on":"");
          html+=`<div class="nav-pair-unit${unitCls}" data-pair-unit="${s.index}">`;
          html+=`<span class="nav-pair-unit__n" aria-hidden="true">${s.index+1}</span>`;
          html+=`<button type="button" class="nav-btn nav-btn--slot${pairOn?" active":""}" data-nav="${esc(s.pairId)}" data-tip="${esc(s.tipPair)}"><span class="nav-btn__body"><span class="nav-btn__title">${esc(s.pairTitle)}</span><span class="nav-sub">${esc(s.pairSub)}</span></span><span class="tag table">R${s.index+1}</span></button>`;
          html+=`<button type="button" class="nav-btn nav-btn--slot nav-btn--json nav-btn--child${addOn?" active":""}" data-nav="${esc(s.addId)}" data-tip="${esc(s.tipAdd)}"><span class="nav-btn__body"><span class="nav-btn__title">${esc(s.addTitle)}</span><span class="nav-sub">${esc(s.addSub)}</span></span><span class="tag json">JSON</span></button>`;
          html+=`</div>`;
        }else{
          html+=navBtnHtml(s);
        }
        j++;
      }
      html+=`</div>`;
      i=j;
      continue;
    }
    html+=navBtnHtml(it);
    i++;
  }
  return html;
}

function renderNav(){
  normalizeActiveSection();
  const nav=$("section-nav");
  if(!nav)return;
  if(!sessionReady){nav.hidden=true;nav.innerHTML="";return}
  nav.hidden=false;
  const {rowMain,rowLinks,rowSchedule}=navItems();
  const groupN=Math.max((data().group||[]).length,0);
  const mainHeavy=groupN>3?" top-nav__row--groups-heavy":"";
  // 1) Конкурс · Индикаторы · Группы  2) Связи + особенности  3) Расписание
  nav.innerHTML=
    `<div class="top-nav__row top-nav__row--main${mainHeavy}">${renderNavRow(rowMain)}</div>`+
    `<div class="top-nav__row top-nav__row--links">${renderNavRow(rowLinks)}</div>`+
    `<div class="top-nav__row top-nav__row--schedule">${renderNavRow(rowSchedule)}</div>`;
  nav.querySelectorAll("[data-nav]").forEach(btn=>btn.addEventListener("click",()=>{
    activeSection=btn.getAttribute("data-nav");
    if(activeSection.startsWith("PAIR:")||activeSection.startsWith("ADD:")){
      const idx=Number(activeSection.split(":")[1])-1;
      activeLink=idx;activeBadge=idx;
    }else if(activeSection.startsWith("GROUP:")){
      activeGroup=Number(activeSection.split(":")[1])-1;
    }else if(activeSection.startsWith("INDICATOR:")){
      activeIndicator=Number(activeSection.split(":")[1])-1;
    }else if(activeSection.startsWith("SCHEDULE:")){
      activeSchedule=Number(activeSection.split(":")[1])-1;
    }
    closeAllDatePops();
    render();
  }));
}
