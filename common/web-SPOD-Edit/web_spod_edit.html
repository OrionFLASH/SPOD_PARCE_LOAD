<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPOD — web-SPOD-Edit (REPORT + заполнение)</title>
  <link rel="stylesheet" href="shell.css" />
  <!-- общий трейс-лог: оболочка — хозяин журнала, программы во фреймах шлют сюда свои строки -->
  <script src="spod_trace.js" data-area="shell"></script>
</head>
<body data-active="report">
  <header class="shell-bar">
    <div class="shell-brand" aria-hidden="true">
      <span class="shell-brand__mark">SPOD</span>
      <span class="shell-brand__title">web-SPOD-Edit</span>
    </div>

    <nav class="shell-tabs" role="tablist" aria-label="Программы">
      <button type="button" class="shell-tab is-active" role="tab" id="tab-report" data-tab="report"
        aria-selected="true" aria-controls="frame-report"
        data-tip="web-report — подготовка REPORT: турниры, источники, ФИО, дубли, CSV/XLSX, обновление REPORT">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
        <span class="shell-tab__text"><b>Подготовка REPORT</b><small>web-report</small></span>
      </button>
      <button type="button" class="shell-tab" role="tab" id="tab-fill" data-tab="fill"
        aria-selected="false" aria-controls="frame-fill"
        data-tip="web-fill — заполнение SPOD: конкурсы, награды, турниры, группы, показатели, расписание; JSON и 6 CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span class="shell-tab__text"><b>Заполнение SPOD</b><small>web-fill</small></span>
      </button>
    </nav>

    <div class="shell-actions">
      <div class="trace-ctl" id="trace-ctl">
        <label class="trace-switch" data-tip="Трейс-лог для разбора сбоев — общий для обеих программ: клики, поля, действия, ошибки; каждая запись сразу сохраняется в браузере и переживает перезагрузку. При открытии страницы выключен">
          <input type="checkbox" id="trace-toggle" />
          <span class="trace-switch__track" aria-hidden="true"></span>
          <span class="trace-switch__label">Лог</span>
        </label>
        <button type="button" class="trace-btn" id="trace-save" disabled data-tip="Скачать ВЕСЬ трейс-лог файлом (.txt)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span id="trace-count">0</span>
        </button>
        <button type="button" class="trace-btn" id="trace-clear" disabled data-tip="Очистить трейс-лог (сам режим не меняется — выключается переключателем «Лог»)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shell-frames">
    <!-- обе программы загружаются сразу и живут независимо: переключение только показывает нужную,
         состояние (загруженные файлы, турниры, конкурсы) сохраняется -->
    <iframe class="shell-frame is-active" id="frame-report" src="report/report_app.html" title="web-report — подготовка REPORT" role="tabpanel" aria-labelledby="tab-report"></iframe>
    <iframe class="shell-frame" id="frame-fill" src="fill/game_fill_settings.html" title="web-fill — заполнение SPOD" role="tabpanel" aria-labelledby="tab-fill"></iframe>
  </main>

  <div id="shell-tip" class="shell-tip" hidden></div>
  <div id="shell-toast" class="shell-toast" hidden></div>
  <script src="shell.js"></script>
</body>
</html>
